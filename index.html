<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ModySoso trailer</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:66.6667%;height:66.6667%;transform:scale(1.5);transform-origin:0 0}</style>
</head>
<body>
<script>
// ModySoso IPTV trailer page.
// Plays one YouTube video and passes messages between the TV app and YouTube, unchanged.
// The player is 2/3 size and scaled up 1.5x, so YouTube picks 720p instead of 1080p (smoother on the TV browser).
(function () {
  var p = new URLSearchParams(location.search), id = p.get('v') || '';
  if (!/^[\w-]{11}$/.test(id)) { document.body.textContent = ''; return; }
  var f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media';
  f.src = 'https://www.youtube.com/embed/' + id +
    '?autoplay=1&controls=0&enablejsapi=1&rel=0&playsinline=1&iv_load_policy=3&fs=0&disablekb=1' +
    '&origin=' + encodeURIComponent(location.origin);
  document.body.appendChild(f);
  window.addEventListener('message', function (e) {
    if (e.source === f.contentWindow) { try { parent.postMessage(e.data, '*'); } catch (x) {} }
    else if (e.source === parent) { try { f.contentWindow.postMessage(e.data, '*'); } catch (x) {} }
  });
})();
</script>
</body>
</html>
